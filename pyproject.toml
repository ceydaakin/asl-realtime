[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asl-realtime"
version = "0.1.0"
description = "Real-time ASL sign recognition from landmarks, running on-device."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
# litert-torch needs torch<2.14, so exporting may need its own venv.
export = ["coremltools>=9", "litert-torch>=0.9"]
# mediapipe 1.0 crashes on macOS ("Service is unavailable"), 0.10.35 works.
demo = ["mediapipe>=0.10.30,<1", "opencv-python>=4.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
